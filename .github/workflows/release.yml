name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Windows, unlike the build workflow, because this one PUBLISHES a Windows executable and
    # compiles an installer.
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Nothing gets released that has not passed the checks, even though the build workflow
      # already ran them - a tag can be pushed to a commit that never saw a pull request.
      - name: Run the checks
        env:
          SG_FETCH_MODEL: '1'
        run: dotnet run --project tests/SoundGeek.Tests -c Release

      # IncludeNativeLibrariesForSelfExtract is not optional here: sherpa-onnx ships
      # onnxruntime.dll and sherpa-onnx-c-api.dll, and a single-file build without it produces
      # an executable that starts and then fails the moment the model is loaded.
      - name: Publish the portable build
        run: >
          dotnet publish src/SoundGeek/SoundGeek.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/app

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found on the runner image, installing it."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup is still not at $iscc." }

          & $iscc "installer\SoundGeek.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE." }

      - name: Collect the artefacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "publish\app\SoundGeek.exe" "dist\SoundGeek-portable.exe" -Force

          if (-not (Test-Path "dist\SoundGeekSetup.exe")) { throw "The setup executable is missing." }

          Remove-Item "dist\SHA256SUMS.txt" -ErrorAction SilentlyContinue
          Get-ChildItem dist -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content "dist\SHA256SUMS.txt" -Encoding ascii
          }

          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: soundgeek-${{ github.ref_name }}
          path: dist/*

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
